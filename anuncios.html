<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento de Anúncios</title>
  <link rel="stylesheet" href="anuncios.css">
</head>
<body>

  <header>
    <h1>Gerenciamento de Anúncios</h1>
  </header>

  <main class="container">
    
    <section class="card">
      <h2>Novo / Editar Anúncio</h2>
      <form id="form-anuncio">
        <input type="hidden" id="anuncio-id">

        <div class="form-group">
          <label for="titulo">Título do Anúncio</label>
          <input type="text" id="titulo" placeholder="Ex: Apartamento no Centro" required>
        </div>

        <div class="form-group">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" rows="3" placeholder="Descreva os detalhes do anúncio..." required></textarea>
        </div>

        <div class="form-group">
          <label for="preco">Preço (R$)</label>
          <input type="number" step="0.01" id="preco" placeholder="0.00" required>
        </div>

        <div class="button-group">
          <button type="submit" class="btn btn-success">Salvar</button>
          <button type="reset" class="btn btn-secondary">Limpar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Moderação de Anúncios</h2>
      
      <div class="action-box">
        <label for="busca-id">Buscar por ID</label>
        <div class="input-inline">
          <input type="number" id="busca-id" placeholder="ID do Anúncio">
          <button type="button" class="btn btn-info">Buscar</button>
        </div>
      </div>

      <hr class="divider">

      <div class="action-box">
        <label for="moderacao-id">Ação Direta por ID</label>
        <input type="number" id="moderacao-id" placeholder="ID do Anúncio" class="mb-2">
        <div class="button-group">
          <button type="button" class="btn btn-success">Aprovar</button>
          <button type="button" class="btn btn-danger">Reprovar</button>
        </div>
      </div>
    </section>

    <section class="card full-width">
      <div class="card-header">
        <h2>Lista de Anúncios</h2>
        <button class="btn btn-primary" id="btn-atualizar-lista">Atualizar Lista</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Preço</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>Casa com 3 quartos</td>
            <td>R$ 1.500,00</td>
            <td><span class="badge badge-warning">Pendente</span></td>
            <td>
              <button class="btn btn-success btn-sm">Aprovar</button>
              <button class="btn btn-danger btn-sm">Reprovar</button>
              <button class="btn btn-secondary btn-sm">Editar</button>
              <button class="btn btn-outline-danger btn-sm">Excluir</button>
            </td>
          </tr>
        </tbody>
      </table>
    </section>

  </main>

</body>
</html>
